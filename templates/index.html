<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnvisaLink</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-csrf="{{ csrf }}">
  <header class="topbar">
    <span class="brand">EnvisaLink</span>
    <a class="navlink" href="{{ url_for('event_log') }}">Log</a>
    <a class="navlink" href="{{ url_for('settings_home') }}">Settings</a>
    <span id="conn" class="conn pending">connecting&hellip;</span>
    <a class="logout" href="{{ url_for('logout') }}">Sign out</a>
  </header>

  <main>
    <section id="partition" class="panel state-unknown">
      <div id="state-label" class="state-label">&mdash;</div>
      <div id="alpha" class="alpha"></div>
      <div class="controls">
        <button class="btn btn-away"   data-action="arm_away">Arm Away</button>
        <button class="btn btn-stay"   data-action="arm_stay">Arm Stay</button>
        <button class="btn btn-disarm" data-action="disarm">Disarm</button>
      </div>
      <div class="quick-keys">
        <button class="btn-quick" id="btn-clear-trouble" data-action="clear_trouble"
                title="Sends your code + OFF to acknowledge troubles and clear alarm memory">Clear trouble</button>
      </div>
      <div id="cmd-msg" class="cmd-msg"></div>
    </section>

    <section class="zones">
      <div class="zones-head">
        <h2>Zones</h2>
        <div class="zone-toggles">
          <label class="switch"><input type="checkbox" id="opt-faulted"><span></span>Faulted only</label>
          <label class="switch"><input type="checkbox" id="opt-unnamed"><span></span>Unnamed zones</label>
        </div>
      </div>
      <div id="zone-groups"></div>
    </section>

    <section class="keypad-section" id="keypad">
      <h2>Keypad</h2>
      <div class="keypad">
        <button class="key" data-key="1"><span class="key-num">1</span><span class="key-fn">OFF</span></button>
        <button class="key" data-key="2"><span class="key-num">2</span><span class="key-fn">AWAY</span></button>
        <button class="key" data-key="3"><span class="key-num">3</span><span class="key-fn">STAY</span></button>
        <button class="key" data-key="4"><span class="key-num">4</span><span class="key-fn">MAX</span></button>
        <button class="key" data-key="5"><span class="key-num">5</span><span class="key-fn">TEST</span></button>
        <button class="key" data-key="6"><span class="key-num">6</span><span class="key-fn">BYPASS</span></button>
        <button class="key" data-key="7"><span class="key-num">7</span><span class="key-fn">INSTANT</span></button>
        <button class="key" data-key="8"><span class="key-num">8</span><span class="key-fn">CODE</span></button>
        <button class="key" data-key="9"><span class="key-num">9</span><span class="key-fn">CHIME</span></button>
        <button class="key" data-key="*"><span class="key-num">&lowast;</span><span class="key-fn">READY</span></button>
        <button class="key" data-key="0"><span class="key-num">0</span><span class="key-fn">&nbsp;</span></button>
        <button class="key" data-key="#"><span class="key-num">#</span><span class="key-fn">&nbsp;</span></button>
      </div>
      <div id="kp-msg" class="cmd-msg"></div>
      <p class="note">Keys go straight to the panel &mdash; type your code to arm or disarm, or use
        <code>*</code> sequences (e.g. <code>*72</code>) just like the physical keypad. Your
        computer's number keys work too.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
